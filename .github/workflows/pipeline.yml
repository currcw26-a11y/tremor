# Runs the Tremor data pipeline every 4 hours on GitHub's computers (free for public repos).
# You can also start it by hand: GitHub → Actions → "Tremor pipeline" → "Run workflow".
#
# ⏰ GitHub turns scheduled runs OFF after 60 days with no commits to this repo.
#    Push any small commit at least once a month, or re-enable it on the Actions tab.
name: Tremor pipeline

on:
  schedule:
    - cron: "17 */4 * * *"   # minute 17 of every 4th hour (UTC). Off the :00 rush hour.
  workflow_dispatch:          # adds a "Run workflow" button
    inputs:
      send_test_email:
        description: "Also send a test alert email to the first signed-up person"
        type: boolean
        default: false
      force_daily:
        description: "Also run the once-a-day steps now (money left, job postings, layoff notices)"
        type: boolean
        default: false

concurrency:
  group: pipeline             # never run two at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run tests (stop if anything is broken)
        run: python -m pytest -q

      - name: Run the pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}  # only needed for keys made outside a workspace
          AI_MONTHLY_BUDGET_USD: "15"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}          # set once your domain is verified; empty = Resend's test sender
          SITE_URL: ${{ vars.SITE_URL }}
          SEND_TEST_EMAIL: ${{ inputs.send_test_email && '1' || '0' }}
          FORCE_DAILY: ${{ inputs.force_daily && '1' || '0' }}
        run: python run.py
