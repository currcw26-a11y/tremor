# Runs the Tremor data pipeline every 4 hours on GitHub's computers (free for public repos).
# You can also start it by hand: GitHub → Actions → "Tremor pipeline" → "Run workflow".
#
# ⏰ GitHub turns scheduled runs OFF after 60 days with no commits to this repo.
#    Push any small commit at least once a month, or re-enable it on the Actions tab.
name: Tremor pipeline

on:
  schedule:
    - cron: "17 */4 * * *"   # minute 17 of every 4th hour (UTC). Off the :00 rush hour.
  workflow_dispatch: {}       # adds a "Run workflow" button

concurrency:
  group: pipeline             # never run two at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run tests (stop if anything is broken)
        run: python -m pytest -q

      - name: Run the pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python run.py
